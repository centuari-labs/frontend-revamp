name: Feature Request
description: Suggest a new feature for the Frontend application
title: "[Feature]: "
labels: ["enhancement", "frontend"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? Fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented. Include mockups or wireframes if available.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Nice to have
        - Important
        - Critical / Blocker
    validations:
      required: true

  - type: checkboxes
    id: considerations
    attributes:
      label: Considerations
      options:
        - label: This feature requires new blockchain interactions
        - label: This feature requires new API endpoints
        - label: This feature may introduce breaking changes to existing UI

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any mockups, wireframes, references, or additional context.
