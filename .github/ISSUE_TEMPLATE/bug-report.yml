name: Bug Report
description: Report a bug in the Frontend application
title: "[Bug]: "
labels: ["bug", "frontend"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (page crash, data loss, funds at risk)
        - High (major feature broken, no workaround)
        - Medium (feature broken, workaround exists)
        - Low (minor visual or UX issue)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Navigate to /market
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console Errors / Network Logs
      description: Paste any browser console errors or failed network requests.
      render: shell

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 130, Firefox 132, Safari 18

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 15, Windows 11, iOS 18

  - type: input
    id: screen
    attributes:
      label: Screen Resolution / Viewport
      placeholder: e.g. 1920x1080, mobile (375px)

  - type: input
    id: wallet
    attributes:
      label: Wallet Provider
      placeholder: e.g. MetaMask, Coinbase Wallet, WalletConnect

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this occur?
      options:
        - Local Development
        - Staging
        - Production
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recording
      description: If applicable, add screenshots or a screen recording to help explain the issue.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, related issues, or potential root cause.
